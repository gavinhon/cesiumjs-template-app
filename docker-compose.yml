services:
  app:
    build: .
    image: cesiumjs-template-app:latest
    ports:
      - '${HTTP_PORT:-8080}:8080'
    environment:
      APP_OFFLINE: ${APP_OFFLINE:-true}
      DEFAULT_BASEMAP: ${DEFAULT_BASEMAP:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      LTA_ACCOUNT_KEY: ${LTA_ACCOUNT_KEY:-}
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set DATA_DIR in .env to your datasets folder, e.g. C:/gis/data}
        target: /data
        read_only: true
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/nginx/tmp
      - /var/lib/nginx/logs
      - /var/log/nginx
    restart: unless-stopped

  terrain:
    build:
      context: .
      dockerfile: Dockerfile.terrain
    image: cesiumjs-terrain:latest
    profiles: [tools]
    volumes:
      - type: bind
        source: ${TERRAIN_INPUT_DIR:-./terrain-input}
        target: /input
        read_only: true
      - type: bind
        source: ${DATA_DIR:?Set DATA_DIR in .env to your datasets folder, e.g. C:/gis/data}
        target: /output

  nominatim:
    image: mediagis/nominatim:5.1
    profiles: [geocoder]
    environment:
      PBF_PATH: /nominatim/extract/${NOMINATIM_PBF:-region.osm.pbf}
      REPLICATION_URL: ''
      IMPORT_WIKIPEDIA: 'false'
    volumes:
      - type: bind
        source: ${NOMINATIM_EXTRACT_DIR:-./nominatim-extract}
        target: /nominatim/extract
        read_only: true
      - nominatim-db:/var/lib/postgresql/16/main
    shm_size: 1g
    restart: unless-stopped

volumes:
  nominatim-db:
