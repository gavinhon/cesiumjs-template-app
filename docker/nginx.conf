worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/vnd.quantized-mesh terrain;
    application/geo+json geojson;
    model/gltf-binary glb;
    model/gltf+json gltf;
    application/octet-stream b3dm i3dm pnts cmpt subtree;
  }

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/css application/javascript application/json application/geo+json
    application/vnd.quantized-mesh model/gltf+json image/svg+xml
    application/octet-stream;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /app-config.json {
      alias /run/app/app-config.json;
      add_header Cache-Control "no-store";
    }
    location = /datasets.json {
      alias /run/app/datasets.json;
      add_header Cache-Control "no-store";
    }

    location /live/ {
      alias /run/app/live/;
      add_header Cache-Control "no-cache";
    }

    location /data/ {
      alias /data/;
      add_header Cache-Control "no-cache";
      sendfile off;
    }

    include /run/app/nginx-*.conf;
  }
}
