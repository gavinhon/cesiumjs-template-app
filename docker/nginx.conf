# nginx for the app's Docker image — see the Dockerfile and
# docs/deployment-docker.md.
#
# Serves three things from one origin, so the app never needs CORS:
#
#   /                      the built app (dist/), baked into the image
#   /data/                 the host's dataset folder, bind-mounted read-only
#   /app-config.json,      written at container start by
#   /datasets.json           scripts/writeRuntimeConfig.ts into /run/app
#
# plus, when NOMINATIM_URL is set, /nominatim/ proxied to that server (a
# location the same script writes; see `include` below).

worker_processes auto;
pid /run/nginx/nginx.pid;
# To the container's output, where `docker compose logs` finds them.
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The geospatial formats nginx doesn't know. Without these, terrain tiles
  # and 3D Tiles content go out as application/octet-stream, which Cesium
  # reads fine — but then gzip (below) can't be told to compress them.
  types {
    application/vnd.quantized-mesh terrain;
    application/geo+json geojson;
    model/gltf-binary glb;
    model/gltf+json gltf;
    application/octet-stream b3dm i3dm pnts cmpt subtree;
  }

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # Quantized-mesh terrain and JSON compress to a third of their size or
  # less. The tiles are stored uncompressed on disk (that's what
  # scripts/build_terrain_tiles.py writes), so nginx compresses them on the
  # way out instead.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/css application/javascript application/json application/geo+json
    application/vnd.quantized-mesh model/gltf+json image/svg+xml
    application/octet-stream;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Always revalidated: a new image changes which hashed bundles it
    # names, and a stale copy would load last build's code.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every bundled file name, so a file at a
    # given URL never changes and can be cached for good.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rewritten on every container start, at fixed URLs — never cached.
    location = /app-config.json {
      alias /run/app/app-config.json;
      add_header Cache-Control "no-store";
    }
    location = /datasets.json {
      alias /run/app/datasets.json;
      add_header Cache-Control "no-store";
    }

    location /data/ {
      alias /data/;
      # Datasets can be replaced in place on the host without a restart,
      # so make the browser check (a cheap 304 when nothing changed)
      # rather than keep showing a tile from the old version.
      add_header Cache-Control "no-cache";
      # Off for the bind mount: Docker Desktop shares Windows folders into
      # the Linux VM through a network filesystem, and sendfile() on such
      # mounts has a history of serving stale or truncated files. Reading
      # through nginx's buffers costs a little throughput and is always
      # correct.
      sendfile off;
    }

    # The optional Nominatim proxy (written only when NOMINATIM_URL is
    # set). A glob that matches nothing is fine, so no file means no proxy.
    include /run/app/nginx-*.conf;
  }
}
