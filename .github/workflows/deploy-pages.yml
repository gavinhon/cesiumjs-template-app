name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button, for redeploying by hand

permissions:
  contents: read
  pages: write # publish the site
  id-token: write # prove to Pages that this workflow is allowed to

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # Vite 8 needs 20.19+ or 22.12+
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
